name: Publish weekly release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'research/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate week
        id: week
        shell: bash
        run: |
          week="${GITHUB_HEAD_REF#research/}"
          if [[ ! "$GITHUB_HEAD_REF" == research/* || ! "$week" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "Invalid research branch name: $GITHUB_HEAD_REF" >&2
            exit 1
          fi
          echo "value=$week" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        env:
          WEEK: ${{ steps.week.outputs.value }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          data_file="data/$WEEK.json"
          readme_file="research/$WEEK/README.md"
          notes_file="$RUNNER_TEMP/release-notes.md"
          start="$(jq -r '.start' "$data_file")"
          end="$(jq -r '.end' "$data_file")"

          {
            printf '# Microsoft Security Latest Feed - %s\n\n' "$WEEK"
            printf '**Window:** %s – %s\n\n' "$start" "$end"
            printf '## Counts by item type\n\n'
            jq -r '.items | group_by(.type)[] | "- \(.[0].type): \(length)"' "$data_file"
            printf '\n'
            awk '
              /^## Gaps$/ { capture=1; found=1 }
              capture && /^## / && $0 != "## Gaps" { exit }
              capture { print }
              END { if (!found) exit 1 }
            ' "$readme_file"
            printf '\n\n## Links\n\n'
            printf -- '- [Research README](%s/%s/blob/main/research/%s/README.md)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$WEEK"
            printf -- '- [Weekly data](%s/%s/blob/main/data/%s.json)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$WEEK"
            printf -- '- [Merged PR](%s)\n' "$PR_URL"
          } > "$notes_file"

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.week.outputs.value }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$WEEK" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$WEEK" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"
          else
            gh release create "$WEEK" --repo "$GITHUB_REPOSITORY" --target main \
              --title "Microsoft Security Latest Feed - $WEEK" --notes-file "$NOTES_FILE"
          fi
